proto ThermoCommEvent

import "ThermoSaveData.proto"

message TempChangedEvent {
    uint8 new_temp_f = 1
}

message SetPointChangedEvent {
    uint8 new_set_point_f = 1
}

enum HeatingCommMode : uint2 {
    HEATING_COMM_HEATING = 0
    HEATING_COMM_COOLING = 1
    HEATING_COMM_IDLE = 2
}

message HeatingModeChangedEvent {
    HeatingCommMode new_mode = 1
}

message SettingsChangedEvent {
    ThermoSaveData.ThermoSaveData new_settings = 1
}