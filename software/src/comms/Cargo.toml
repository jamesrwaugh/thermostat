[package]
name = "comms"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
esp-hal = { version = "1.0", features = ["esp32c3", "unstable"], exception-handler = false }

[lints.clippy]
# mem::forget is not safe with esp-hal types
mem_forget = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.dev]
opt-level = "s"

[build-dependencies]
bindgen = "0.71.0"
cc = "1.0"

[profile.release]
opt-level = "s"
debug = 2
debug-assertions = false
overflow-checks = false
lto = true
incremental = false
codegen-units = 1
