proto HomeAssistantSerial

enum HaTopicKey : uint8 {
    ACTION_TOPIC = 0
    CURRENT_HUMIDITY_TOPIC = 1
    CURRENT_TEMP_TOPIC = 2
    FAN_MODE_COMMAND_TOPIC = 3
    FAN_MODE_STATE_TOPIC = 4
    MODE_COMMAND_TOPIC = 5
    MODE_STATE_TOPIC = 6
    POWER_COMMAND_TOPIC = 7
    TEMP_COMMAND_TOPIC = 10
    TEMP_STATE_TOPIC = 11
    MQTT_PING_TOPIC = 12

    // Not supported from MQTT Climate:
    // PRESET_MODE_COMMAND_TOPIC = 8
    // CONF_PRESET_MODE_STATE_TOPIC = 9
    // CONF_HUMIDITY_STATE_TOPIC = 5
    // CONF_HUMIDITY_COMMAND_TOPIC = 5
    // CONF_SWING_HORIZONTAL_MODE_COMMAND_TOPIC = 0
    // CONF_SWING_HORIZONTAL_MODE_STATE_TOPIC = 0
    // CONF_SWING_MODE_COMMAND_TOPIC = 0
    // CONF_SWING_MODE_STATE_TOPIC = 0
    // TEMP_HIGH_COMMAND_TOPIC = 12
    // TEMP_HIGH_STATE_TOPIC = 13
    // TEMP_LOW_COMMAND_TOPIC = 14
    // TEMP_LOW_STATE_TOPIC = 15
}

enum HaActionTopicKey : uint3 {
    HA_ACTION_OFF = 0
    HA_ACTION_HEATING = 1
    HA_ACTION_COOLING = 2
    HA_ACTION_IDLE = 3
    HA_ACTION_FAN = 4
}

message HaCommand {
    uint8 checksum = 1
    HaTopicKey topic_key = 2
    uint8 payload_byte_one = 3
    uint8 payload_byte_two = 4
}
